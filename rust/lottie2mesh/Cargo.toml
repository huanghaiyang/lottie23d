[package]
name = "lottie2mesh"
version = "0.1.0"
edition = "2021"
description = "Compile Lottie vector animations into extruded 3D meshes with baked animation tracks"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lottie2mesh-cli"
path = "src/bin/cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
earcutr = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
