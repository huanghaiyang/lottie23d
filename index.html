<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rust 将 Lottie 矢量动画转换为带厚度与深度的 3D 网格，左侧 lottie-web，右侧 three.js 同步播放"
    />
    <title>Lottie 2 3D · Rust 矢量转网格</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">L<span class="brand-arrow">→</span>3D</span>
          <div class="brand-copy">
            <h1>Lottie 2 3D</h1>
            <p>Rust 把矢量关键帧烘成可环绕的立体网格</p>
          </div>
        </div>

        <div class="sources" role="group" aria-label="动画来源">
          <button class="chip" data-source="orbit" type="button">星轨</button>
          <button class="chip" data-source="pulse" type="button">脉冲</button>
          <button class="chip" data-source="demo:starfish" type="button">海星</button>
          <button class="chip" data-source="demo:lights" type="button">彩灯</button>
          <button class="chip" data-source="demo:dalek" type="button">Dalek</button>
          <button class="chip chip-accent" id="pick-file" type="button">导入 JSON</button>
          <input id="file-input" type="file" accept=".json,application/json" hidden />
        </div>

        <div class="stats" aria-label="转换统计">
          <span class="stat" id="stat-conversion">等待转换</span>
          <span class="stat" id="stat-frames">-- 帧</span>
          <span class="stat" id="stat-geometry">-- 网格</span>
          <span class="stat stat-strong" id="stat-size">--</span>
        </div>
      </header>

      <main class="workspace">
        <section class="pane">
          <div class="pane-head">
            <div class="pane-title">
              <span class="dot dot-lottie"></span>
              <h2>Lottie Web</h2>
            </div>
            <span class="pane-meta" id="left-meta">--</span>
          </div>
          <div class="canvas-wrap canvas-lottie" id="lottie-host">
            <span class="canvas-hint" id="lottie-hint">加载中…</span>
          </div>
          <span class="pane-badge">2D 原画</span>
        </section>

        <section class="pane">
          <div class="pane-head">
            <div class="pane-title">
              <span class="dot dot-three"></span>
              <h2>Three.js</h2>
            </div>
            <span class="pane-meta" id="right-meta">--</span>
          </div>
          <div class="canvas-wrap canvas-three" id="three-host">
            <span class="canvas-hint">拖拽环绕 · 滚轮缩放</span>
          </div>
          <span class="pane-badge">Rust 生成网格</span>
        </section>
      </main>

      <footer class="transport">
        <button class="play" id="play-toggle" type="button" aria-pressed="true">
          <span id="play-label">暂停</span>
        </button>

        <div class="timeline">
          <input
            id="timeline"
            type="range"
            min="0"
            max="1000"
            step="1"
            value="0"
            aria-label="动画进度"
          />
          <span class="frame-readout" id="frame-label">000 / 000</span>
        </div>

        <div class="fields">
          <label class="field" for="speed">
            <span>速度</span>
            <input id="speed" type="range" min="25" max="200" step="5" value="100" />
            <output id="speed-label">1.00×</output>
          </label>
          <label class="field" for="depth">
            <span>层深</span>
            <input id="depth" type="range" min="0" max="250" step="5" value="100" />
            <output id="depth-label">1.00</output>
          </label>
          <label class="field" for="thickness">
            <span>厚度</span>
            <input id="thickness" type="range" min="25" max="250" step="5" value="100" />
            <output id="thickness-label">1.00×</output>
          </label>
        </div>

        <div class="view-actions">
          <label class="toggle">
            <input id="autorotate" type="checkbox" checked />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span>自动环绕</span>
          </label>
          <button class="ghost" id="reset-view" type="button">重置视角</button>
          <span class="fps" id="fps-readout">-- FPS</span>
        </div>
      </footer>
    </div>

    <div class="drop-overlay" id="drop-overlay">
      <div class="drop-card">
        <strong>释放以转换 Lottie</strong>
        <span>支持 Bodymovin 导出的 .json</span>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
